<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Event Portal</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

    <h1 id="mainHeading">Community Event Portal</h1>

    <div id="eventContainer"></div>

    <button id="addBtn">Add Event</button>

    <h2>Registration Form</h2>

    <form id="registrationForm">
        <input type="text" id="username" placeholder="Enter Name">
        <input type="email" id="email" placeholder="Enter Email">

        <button type="submit">Register</button>
    </form>

    <h2>Task 8 - Event Handling</h2>

    <input
        type="text"
        id="userInput"
        placeholder="Type something">

    <p id="keyMessage"></p>

    <select id="eventSelect">
        <option value="">Select Event</option>
        <option value="Music">Music Festival</option>
        <option value="Tech">Tech Meetup</option>
        <option value="Food">Food Fair</option>
    </select>

    <p id="selectedEvent"></p>

    <button id="clickBtn">
        Click Me
    </button>

    <button id="dblClickBtn">
        Double Click Me
    </button>

    <script src="main.js"></script>

</body>
</html>
